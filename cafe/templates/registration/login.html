{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow-sm border-dark p-4">

            <h2 class="mb-4 text-center fw-bold">
                Login
            </h2>

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit"
                        class="btn btn-dark w-100">

                    Login

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
