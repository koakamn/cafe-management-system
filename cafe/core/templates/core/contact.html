{% extends 'base.html' %}

{% block title %}Contact{% endblock %}

{% block content %}

<div class="text-center mb-5">

    <h1 class="display-4 fw-bold">
        Contact Us
    </h1>

    <p class="lead text-muted">
        We'd love to hear from you
    </p>

</div>

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-sm border-dark">

            <div class="card-body p-5">

                <div class="row g-4">

                    <div class="col-md-6">

                        <h4 class="fw-bold">
                            Address
                        </h4>

                        <p class="text-muted">
                            Astana, Kazakhstan
                            <br>
                            Mangilik El Avenue
                        </p>

                    </div>

                    <div class="col-md-6">

                        <h4 class="fw-bold">
                            Phone
                        </h4>

                        <p class="text-muted">
                            +7 777 777 77 77
                        </p>

                    </div>

                    <div class="col-md-6">

                        <h4 class="fw-bold">
                            Email
                        </h4>

                        <p class="text-muted">
                            cafe@example.com
                        </p>

                    </div>

                    <div class="col-md-6">

                        <h4 class="fw-bold">
                            Working Hours
                        </h4>

                        <p class="text-muted">
                            Mon - Sun
                            <br>
                            08:00 - 23:00
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
