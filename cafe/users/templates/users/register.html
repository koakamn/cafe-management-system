{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow-sm border-dark p-4">

            <h2 class="mb-4 text-center fw-bold">
                Register
            </h2>

            <form method="post">

                {% csrf_token %}
                {{form.errors}}

                <div class="mb-3">
                    {{ form.username.label_tag }}
                    {{ form.username }}
                </div>

                <div class="mb-3">
                    {{ form.password1.label_tag }}
                    {{ form.password1 }}
                </div>

                <div class="mb-3">
                    {{ form.password2.label_tag }}
                    {{ form.password2 }}
                </div>

                <button type="submit"
                        class="btn btn-dark w-100">

                    Create Account

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
